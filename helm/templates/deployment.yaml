apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nexmesh.fullname" . }}
  labels:
    {{- include "nexmesh.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "nexmesh.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nexmesh.labels" . | nindent 8 }}
    spec:
      containers:
        - name: backend
          image: {{ .Values.backend.image }}
          securityContext:
            capabilities:
              add:
                - SYS_ADMIN
            runAsNonRoot: false
            runAsUser: 0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          workingDir: "/app"
          env: # required for pacc
            - name: MAPR_HOME
              value: /opt/mapr
            - name: LD_LIBRARY_PATH
              value: /opt/mapr/lib
          # livenessProbe:
          #   httpGet:
          #     path: /health
          #     port: 8000
          # readinessProbe:
          #   httpGet:
          #     path: /health
          #     port: 8000
          resources:
            limits:
              cpu: 2000m
              memory: 8Gi
            requests:
              cpu: 2000m
              memory: 4Gi

        - name: frontend
          image: {{ .Values.frontend.image }}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          workingDir: "/app"
          env:
            - name: BACKEND_URL
              value: "http://localhost:8000"
          # livenessProbe:
          #   httpGet:
          #     path: /
          #     port: 3000
          # readinessProbe:
          #   httpGet:
          #     path: /
          #     port: 3000
          resources:
            limits:
              cpu: 2000m
              memory: 8Gi
            requests:
              cpu: 2000m
              memory: 4Gi

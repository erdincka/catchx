apiVersion: v1
kind: Service
metadata:
  name: {{ include "nexmesh.fullname" . }}
  labels:
    {{- include "nexmesh.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    {{- include "nexmesh.selectorLabels" . | nindent 4 }}

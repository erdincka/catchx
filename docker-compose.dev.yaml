# Development overrides — merged with docker-compose.yaml by Tilt
# Mounts source directories so file changes are visible without rebuilds.
# Backend runs uvicorn with --reload; frontend runs NiceGUI with reload=true.
services:
  backend:
    volumes:
      - ./backend:/app/backend
    command:
      - /app/backend/.venv/bin/uvicorn
      - main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload

  frontend:
    volumes:
      - ./frontend:/app/frontend
    environment:
      - BACKEND_URL=http://backend:8000
      - NICEGUI_RELOAD=true

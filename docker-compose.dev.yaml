# Development overrides — merged with docker-compose.yaml by Tilt.
# Source directories are mounted as volumes; the venv lives at /opt/venv/*
# inside the image so it is never shadowed by the mounts.
services:
  backend:
    volumes:
      - ./backend:/app/backend
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    volumes:
      - ./frontend:/app/frontend
    environment:
      - BACKEND_URL=http://backend:8000
      - NICEGUI_RELOAD=true
